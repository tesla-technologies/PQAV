[package]
name = "mvp-ts"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "MVP of PQAV: post-quantum signing of each component of an MPEG-TS stream"
repository = "https://github.com/tesla-technologies/PQAV"
[lib]
name = "pqav"
path = "src/lib.rs"
[[bin]]
name = "pqav-keygen"
path = "src/bin/pqav-keygen.rs"
[[bin]]
name = "pqav-sign"
path = "src/bin/pqav-sign.rs"
[[bin]]
name = "pqav-verify"
path = "src/bin/pqav-verify.rs"
[dependencies]
ml-dsa     = "=0.1.1"
sha2       = "0.10"
minicbor   = { version = "=2.3.0", features = ["alloc"] }
getrandom  = "0.3"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
clap       = { version = "4", features = ["derive"] }
hex        = "0.4"
[profile.release]
opt-level = 3
